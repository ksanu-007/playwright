appId: com.infinite.netsfere-ios
tags:
  - ios-relaunch-app
---
# =============================================================================
# Force-relaunch used ONLY by MaestroRunner's retry path (see
# maestroRunner.js), never by a flow's own happy path — every "interior"
# iOS flow in this repo deliberately skips launchApp so it doesn't reset the
# app back to its Conversations root screen between every single step (see
# ios-send-message.yaml's own header note). If a step still fails (e.g. the
# app genuinely crashed or got backgrounded), this brings it back before the
# retry attempt runs.
# =============================================================================
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Enter the password for"
    commands:
      - tapOn: "Not Now"
