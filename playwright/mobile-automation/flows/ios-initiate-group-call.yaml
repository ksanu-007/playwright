appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-initiate-group-call
---
# =============================================================================
# iOS initiates a call (audio or video) in a conversation — mirror of
# android-initiate-group-call.yaml.
# Requires: CONVERSATION_NAME, CALL_TYPE ("Audio Call" or "Video Call"),
# CALL_DURATION_TEXT.
#
# VERIFIED live on 2026-08-03: tapping the chat nav bar's "Call" button opens
# a real menu with exactly these options: "Audio Call", "Video Call",
# "SecureMeet" (CALL_TYPE must match one of the first two exactly).
#
# UNVERIFIED beyond that point: initiating a real call needs a second party
# to answer, which solo device exploration can't exercise — I could not
# confirm the in-call screen's real hangup-button identifier or whether a
# "RING ALL" confirmation step exists on iOS the way it does on Android.
# call_hangup_button below is an unverified placeholder carried over from the
# Android mirror's naming, not a confirmed real NETS_* id.
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
# Fixed 2026-08-04: multiple conversations can share the same title (see
# ios-create-conversation.yaml header — always-fresh creation means
# duplicates accumulate). index:0 forces the topmost (most recently
# active) match, confirmed via screenshot to sort newest-first.
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- assertVisible:
    text: "Type Message Here.."
- tapOn: "Call"
- extendedWaitUntil:
    visible: ${CALL_TYPE}
    timeout: 10000
- tapOn: ${CALL_TYPE}
# UNVERIFIED: real device does not have a confirmed hangup-control id
- runFlow:
    when:
      visible: "RING ALL"
    commands:
      - tapOn: "RING ALL"
- extendedWaitUntil:
    visible:
      id: "call_hangup_button"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${CALL_DURATION_TEXT}
    timeout: 60000
- tapOn:
    id: "call_hangup_button"
