appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-verify
---
# =============================================================================
# iOS verifies a specific message's text is NO LONGER visible in a
# conversation — used to confirm a deletion synced from the other side.
# Requires: CONVERSATION_NAME, TARGET_TEXT (the original message content).
#
# Discovered live 2026-08-07: the "This message was deleted by the sender."
# placeholder that replaces a deleted message is NOT exposed in iOS's
# accessibility tree at all (confirmed via a raw hierarchy dump — the
# timestamp and sender-name labels either side of it ARE present, but the
# placeholder's own text node is simply absent), so no text-matching
# assertion against that placeholder can ever pass, regardless of the
# pattern used. Verifying that the ORIGINAL message text has disappeared is
# the reliable, accessible signal instead.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- assertVisible:
    text: "Type Message Here.."
- extendedWaitUntil:
    notVisible:
      text: ${TARGET_TEXT}
    timeout: 45000
- tapOn:
    id: "BackButton"
