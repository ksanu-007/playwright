appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-delete-message
---
# =============================================================================
# Android deletes a specific existing message (long-press -> overflow -> Delete
# -> confirm). Requires: CONVERSATION_NAME, TARGET_TEXT.
#
# Verified live 2026-08-07: the "N Selected" action bar's overflow (an
# ImageView with content-desc "More options", no resource-id) holds Delete
# alongside Read Status/Export/Copy/Select All. The confirmation dialog's
# button is uppercase ("DELETE") per Android's Material dialog styling, unlike
# the context-menu entry — the extendedWaitUntil on the dialog's own text
# between the two taps confirms which one is on screen before the second tap.
# Deletion is for-everyone by default, same as iOS: own bubble becomes "This
# message was deleted by you.", recipient's becomes "...by sender."
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- longPressOn:
    text: ${TARGET_TEXT}
- tapOn: "More options"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete Message"
    timeout: 10000
- tapOn: "DELETE"
- extendedWaitUntil:
    visible:
      text: "This message was deleted by you."
    timeout: 15000
