appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-send-attachment
---
# =============================================================================
# iOS sends a document attachment in a conversation — mirror of
# android-send-attachment.yaml. Requires: CONVERSATION_NAME.
#
# The attachment menu itself (add -> Attach Documents) is verified live on
# 2026-08-03: real options are "Take Photo/Video", "NETS_ChooseFromLibrary",
# "Attach Documents", "Attach from Cloud Storage", "Share Location", "Create
# Poll". "Attach Documents" opens iOS's native system document picker
# (Files-app style UI), which is OUTSIDE the app's own accessibility tree and
# depends on what's actually present in Files/iCloud Drive on the specific
# device.
#
# Fixed 2026-08-05: this flow previously stopped right after "Attach
# Documents" with no file-selection tap at all, so it only ever completed by
# timing out (the picker sheet stayed open, "Type Message Here.." never
# reappeared) — S7 wraps this in a try/catch and treats that timeout as a
# soft failure, so it never actually verified anything was sent. The default
# landing tab ("Browse", "On My iPhone") reliably shows a locally-available
# file with no accessibility id, so the first thumbnail is targeted by point
# (grid position verified live via pixel inspection of a real screenshot). A
# single tap both selects and returns to the conversation (no iCloud-download
# step needed, unlike ios-send-document.yaml's search results). Final send
# tap reuses the same (92%, 92%) compose-bar send-icon coordinate verified
# for ios-send-image.yaml — id "paperplane.fill" is not exposed as visible in
# the accessibility tree once an attachment is staged with no typed text,
# even though it's reliably visible whenever text has been typed first.
#
# Note 2026-08-05: despite the page-preview-style thumbnail (which looks
# PDF-like), the first Browse item is actually an
# AI_Meeting_Notes_Summary_*.docx export (confirmed via the sent message's
# caption on web) — not a .pdf. A live search for real .pdf files on this
# device only surfaced personal documents (a bank statement, a medical
# report, an ID scan) with no safe dedicated PDF test fixture, so this flow
# intentionally sends a Word document rather than chasing a PDF — per user
# decision, do not target any of those personal files.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
# Fixed 2026-08-04: multiple conversations can share the same title (see
# ios-create-conversation.yaml header — always-fresh creation means
# duplicates accumulate). index:0 forces the topmost (most recently
# active) match, confirmed via screenshot to sort newest-first.
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- assertVisible:
    text: "Type Message Here.."
- tapOn: "add"
- extendedWaitUntil:
    visible: "Attach Documents"
    timeout: 10000
- tapOn: "Attach Documents"
- runFlow:
    when:
      visible: "Allow Once"
    commands:
      - tapOn: "Allow Once"
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "17%,29%"
- extendedWaitUntil:
    visible:
      text: "Type Message Here.."
    timeout: 20000
- tapOn:
    point: "92%,92%"
- extendedWaitUntil:
    visible:
      text: ".*\\(.*[KM]B\\).*"
    timeout: 20000
