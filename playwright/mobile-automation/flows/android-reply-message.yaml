appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-reply-message
---
# =============================================================================
# Android replies to a specific existing message (long-press -> reply_item).
# Requires: CONVERSATION_NAME, TARGET_TEXT, REPLY_TEXT.
#
# Verified live 2026-08-07: unlike iOS's text-labeled context menu, long-press
# here enters a "N Selected" action bar (reply_item, forward_item, and an
# overflow "More options" for Delete/Copy/etc — see android-delete-message.yaml
# / android-forward-message.yaml). Tapping reply_item opens the quoted-reply
# compose bar; the edittext still needs an explicit tap before inputText, same
# as every other Android send flow in this repo.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- longPressOn:
    text: ${TARGET_TEXT}
- tapOn:
    id: "com.infinite.netsfere:id/reply_item"
- tapOn:
    id: "com.infinite.netsfere:id/send_message_edittext"
- inputText: ${REPLY_TEXT}
- hideKeyboard
- tapOn:
    id: "com.infinite.netsfere:id/send_button"
- extendedWaitUntil:
    visible:
      text: ".*${REPLY_TEXT}.*"
    timeout: 15000
