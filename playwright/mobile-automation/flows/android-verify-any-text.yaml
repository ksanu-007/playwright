appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-verify
---
# =============================================================================
# Android verifies any visible text (by substring) in a specific conversation —
# sibling of android-verify-message.yaml/android-check-message.yaml, but
# without their id: "message_content_textview" constraint. Requires:
# CONVERSATION_NAME, EXPECTED_TEXT.
#
# Added for iostoandroid.spec.js: android-send-location.yaml's own
# post-send assertion already shows a location caption uses a different id
# (file_name_textView_bottom, not message_content_textview) — the same
# plain-text-vs-attachment/location id gap ios-verify-any-text.yaml was built
# to work around on iOS. It reuses android-verify-message.yaml's proven
# navigation exactly, only relaxing the final assertion to a plain text
# match.
#
# Fixed 2026-08-06 (verified live): same timing race already fixed in
# android-verify-message.yaml — a plain assertVisible right after tapOn
# raced the chat screen's own render/transition. Switched to
# extendedWaitUntil for the same reason.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ".*${EXPECTED_TEXT}.*"
    timeout: 45000
- back
