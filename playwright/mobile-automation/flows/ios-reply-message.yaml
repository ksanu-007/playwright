appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-reply-message
---
# =============================================================================
# iOS replies to a specific existing message (long-press -> Reply). Requires:
# CONVERSATION_NAME, TARGET_TEXT (exact text of the message being replied to),
# REPLY_TEXT.
#
# Verified live 2026-08-07: long-press on a plain-text message opens Info/Copy/
# Reply/Forward/Export/Delete. Reply opens a quoted-preview banner ("You /
# <TARGET_TEXT>") above the compose bar but does NOT auto-focus the text field
# (typing without an explicit tap first goes nowhere) — same gap already
# documented for the attachment flows' compose bar. Sent reply renders as one
# bubble containing the quoted preview + REPLY_TEXT.
#
# Fixed 2026-08-18: ios-forward-message.yaml and ios-delete-message.yaml
# both hit the same timing race — long-pressing a message too soon after
# it's sent/navigated-to renders a reduced Info/Reply/Export-only context
# menu under a full concurrent 3-platform run's load (Reply itself always
# happened to be in that reduced menu, which is likely why this flow never
# visibly failed — but Copy/Forward/Delete being absent in that same state
# means the underlying race is present here too). Same settle-wait applied
# proactively.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn:
    text: ${TARGET_TEXT}
- tapOn: "Reply"
- tapOn:
    text: "Type Message Here.."
- inputText: ${REPLY_TEXT}
- tapOn:
    id: "paperplane.fill"
- extendedWaitUntil:
    visible:
      text: ".*${REPLY_TEXT}.*"
    timeout: 15000
