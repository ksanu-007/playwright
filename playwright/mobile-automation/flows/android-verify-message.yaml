appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-verify
---
# =============================================================================
# Android verifies a message in a specific conversation
# Requires: CONVERSATION_NAME, EXPECTED_TEXT
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
# Fixed 2026-08-06: plain assertVisible right after tapOn raced the chat
# screen's own render/transition (confirmed live: the message had genuinely
# already arrived — visible in the conversation-list preview — but the
# immediately-following assertVisible for the edittext still failed).
# Same fix already applied on the iOS mirror (see ios-verify-message.yaml's
# own header note) — extendedWaitUntil tolerates the transition instead of
# asserting instantly.
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ${EXPECTED_TEXT}
      id: "com.infinite.netsfere:id/message_content_textview"
    timeout: 30000
- back
