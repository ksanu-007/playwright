appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-forward-message
---
# =============================================================================
# Android forwards a specific existing message to a target conversation.
# Requires: CONVERSATION_NAME, TARGET_TEXT, FORWARD_TO.
#
# Verified live 2026-08-07: forward_item (from the "N Selected" action bar)
# opens the same "Select Conversations" checklist as iOS's Forward, but
# confirms via a floating action_send_fab button (paper-plane FAB, bottom
# right) rather than a top-bar "Send" label.
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- longPressOn:
    text: ${TARGET_TEXT}
- tapOn:
    id: "com.infinite.netsfere:id/forward_item"
# Fixed 2026-08-10: bumped 10000 -> 30000 -> 60000 -> 90000, chasing what
# looked like a slow render (screenshots taken moments after each failure
# consistently showed "Select Conversations" fully rendered) — but root-
# caused live 2026-08-12: even a bare, isolated `assertVisible` against
# this exact text, run standalone with no other steps, failed after ~37s
# while a raw `adb shell uiautomator dump` against the SAME screen found
# the text in ~2s. So this was never a render-speed issue — it's Maestro's
# own Android hierarchy-fetch layer failing to surface this specific
# toolbar TextView after sustained long-running sessions (confirmed: even
# a full app relaunch between retries didn't clear it). No timeout fixes
# this. Switched to the picker's actual list container by resource-id
# instead of matching the toolbar's title text — confirmed live this
# resolves instantly (~1s) on the exact screen where the text match hung.
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/conversation_list"
    timeout: 30000
- tapOn:
    text: ${FORWARD_TO}
    index: 0
- tapOn:
    id: "com.infinite.netsfere:id/action_send_fab"
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
