appId: com.infinite.netsfere
tags:
  - android-send-attachment
  - group
---
# =============================================================================
# Android sends a document attachment by its exact, known filename —
# requires the file to already be pushed to /sdcard/Download/ and
# media-scanned first (see MaestroRunner.pushFileToAndroid), so this
# selects a specific, framework-controlled test file rather than whatever
# the native picker happens to default to (unlike the older
# android-send-attachment.yaml, which just confirms whatever's already
# selected).
# Requires: CONVERSATION_NAME, FILE_NAME (exact filename as pushed, e.g.
# "GroupAttachmentSample.pdf").
#
# Verified live 2026-08-06 end-to-end against a real Pixel 7a, including
# inside a group conversation:
#   - The attach menu's actual current label is "Attach Documents" (plural)
#     — NOT "Document" (singular), which is what the older
#     android-send-attachment.yaml taps. That flow may now be stale against
#     this app build; this one uses the confirmed-live label.
#   - "Attach Documents" opens straight to the system Downloads picker
#     (package com.google.android.documentsui, a different app — Maestro
#     still drives it fine at the OS UI Automator level, same as this
#     repo's other cross-package permission-dialog taps). The just-pushed
#     file appears immediately as the top/most-recent item after the
#     media-scan broadcast, with no extra navigation needed.
#   - Selecting it opens a "New attachment" preview with its own dedicated
#     send_button (not the generic action_done id the Photo/Video and
#     legacy Document flows use).
# =============================================================================
# Note 2026-08-09: no launchApp here on purpose — the app is left running
# by whichever step ran before this one, and relaunching it every single
# step was confirmed live to force iOS back to its Conversations root
# screen even with clearState:false (Android preserves state fine, but
# skipping launchApp here keeps both platforms' flows on the same
# pattern). The BackButton/tab-bar fallback below still gets us to the
# right screen regardless of where the previous step left off. If the
# app were ever genuinely closed/crashed, MaestroRunner's retry path
# force-relaunches it before retrying (see maestroRunner.js).
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- tapOn:
    id: "com.infinite.netsfere:id/insert_attachment_button"
- extendedWaitUntil:
    visible: "Attach Documents"
    timeout: 10000
- tapOn: "Attach Documents"
- extendedWaitUntil:
    visible: ${FILE_NAME}
    timeout: 15000
- tapOn: ${FILE_NAME}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_button"
    timeout: 15000
- tapOn:
    id: "com.infinite.netsfere:id/send_button"
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000
- back
