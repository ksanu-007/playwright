appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-call-and-share
---
# =============================================================================
# iOS initiates an audio call AND shares screen within the same flow — mirror
# of android-call-and-share.yaml.
# Requires: CONVERSATION_NAME, CALL_TYPE, CALL_DURATION_TEXT, PASSWORD
#
# VERIFIED live on 2026-08-03: the "Call" nav button + Audio/Video Call menu.
#
# HIGHEST-RISK FLOW, still unverified beyond the call menu: iOS screen sharing
# goes through ReplayKit's system broadcast picker (not an in-app button like
# Android), and the in-call hangup control was never confirmed against a real
# 2-party call (needs a second device/session to answer, which solo
# exploration on one physical device can't exercise). Treat everything below
# the call-type tap as a structural placeholder, not a verified sequence.
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
# Fixed 2026-08-04: multiple conversations can share the same title (see
# ios-create-conversation.yaml header — always-fresh creation means
# duplicates accumulate). index:0 forces the topmost (most recently
# active) match, confirmed via screenshot to sort newest-first.
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- assertVisible:
    text: "Type Message Here.."
- tapOn: "Call"
- extendedWaitUntil:
    visible: ${CALL_TYPE}
    timeout: 10000
- tapOn: ${CALL_TYPE}
- runFlow:
    when:
      visible: "RING ALL"
    commands:
      - tapOn: "RING ALL"
- extendedWaitUntil:
    visible:
      id: "call_hangup_button"
    timeout: 60000
# Screen share via ReplayKit's system broadcast picker (unverified)
- runFlow:
    when:
      visible:
        id: "action_screen_share"
      timeout: 3000
    commands:
      - tapOn:
          id: "action_screen_share"
- runFlow:
    when:
      visible: "START NOW"
    commands:
      - tapOn: "START NOW"
- runFlow:
    when:
      visible: "Broadcast"
    commands:
      - tapOn: "Broadcast"
- extendedWaitUntil:
    visible:
      text: ${CALL_DURATION_TEXT}
    timeout: 60000
- tapOn:
    id: "call_hangup_button"
