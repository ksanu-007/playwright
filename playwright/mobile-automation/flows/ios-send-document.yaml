appId: com.infinite.netsfere-ios
tags:
  - cross-platform
  - ios-send-attachment
---
# =============================================================================
# iOS sends a Word/Office document attachment via the Files-app document
# picker — companion to ios-send-attachment.yaml (which picks a locally-
# available PDF from the default Browse landing) and ios-send-image.yaml
# (which picks a photo from the Photo Library). Requires: CONVERSATION_NAME.
#
# Verified live on 2026-08-05: the default "Browse" landing only has PDFs on
# this device — no Word-type file is visible without searching. Searching
# "DOCFile" (an existing fixture already present on this device/account,
# containing the text "Netsfere automation doc file") surfaces exactly 2
# matches. Those matches show a cloud-download badge (iCloud-only, not
# locally cached) and their filename text is NOT reliably exposed to the
# accessibility tree (a plain tapOn by text failed even though the same text
# is clearly visible on screen), so the first result is targeted by point
# instead. Picking an iCloud-only file is a TWO-tap interaction: the first
# tap only triggers the download (confirmed via the cloud badge disappearing
# from the thumbnail on a follow-up screenshot, while "Type Message Here.."
# still had not reappeared); a second tap on the same coordinate, after the
# download completes, actually selects it and returns to the conversation.
# Final send tap reuses the same (92%, 92%) compose-bar send-icon coordinate
# verified for ios-send-image.yaml/ios-send-attachment.yaml — id
# "paperplane.fill" is not exposed as visible once an attachment is staged
# with no typed text.
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      visible:
        id: "NETS_ConversationTab"
    commands:
      - tapOn:
          id: "NETS_ConversationTab"
- extendedWaitUntil:
    visible:
      id: "NETS_CreateConversationButton"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "NETS_ConversationTitle"
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    id: "NETS_ConversationTitle"
    text: ${CONVERSATION_NAME}
    index: 0
- assertVisible:
    text: "Type Message Here.."
- tapOn: "add"
- extendedWaitUntil:
    visible: "Attach Documents"
    timeout: 10000
- tapOn: "Attach Documents"
- runFlow:
    when:
      visible: "Allow Once"
    commands:
      - tapOn: "Allow Once"
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Search"
- inputText: "DOCFile"
- tapOn: "search"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "12%,33%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "12%,33%"
- extendedWaitUntil:
    visible:
      text: "Type Message Here.."
    timeout: 20000
- tapOn:
    point: "92%,92%"
- extendedWaitUntil:
    visible:
      text: ".*\\(.*[KM]B\\).*"
    timeout: 20000
