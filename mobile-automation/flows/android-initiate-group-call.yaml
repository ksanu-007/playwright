appId: com.infinite.netsfere
tags:
  - cross-platform
  - android-initiate-group-call
---
# =============================================================================
# Android initiates a call (audio or video) in a conversation
# Requires: CONVERSATION_NAME, CALL_TYPE, CALL_DURATION_TEXT
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- assertVisible:
    id: "com.infinite.netsfere:id/send_message_edittext"
- tapOn:
    id: "com.infinite.netsfere:id/menu_call_item"
- extendedWaitUntil:
    visible:
      text: ${CALL_TYPE}
    timeout: 10000
- tapOn:
    text: ${CALL_TYPE}
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/call_fab"
    timeout: 10000
- tapOn:
    id: "com.infinite.netsfere:id/call_fab"
- extendedWaitUntil:
    visible:
      text: "RING ALL"
    timeout: 10000
- tapOn:
    text: "RING ALL"
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/call_hangup"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${CALL_DURATION_TEXT}
    timeout: 60000
- tapOn:
    id: "com.infinite.netsfere:id/call_hangup"
