appId: com.infinite.netsfere
tags:
  - android-edit-participants
---
# =============================================================================
# Android edits participants during conversation creation.
# Selects CONVERSATION_NAME + TARGET_USER1 (+ optional TARGET_USER2)
# via checkboxes in the contact list, then creates the conversation.
# Requires: CONVERSATION_NAME, TARGET_USER1, TARGET_USER2 (optional)
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 30000
- tapOn:
    id: "com.infinite.netsfere:id/new_conversation_fab"
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/search_view"
    timeout: 15000
- tapOn:
    id: "com.infinite.netsfere:id/conversation_title_edit_text"
- inputText: ${CONVERSATION_NAME}
- tapOn:
    id: "android:id/search_src_text"
- inputText: ${CONVERSATION_NAME}
- extendedWaitUntil:
    visible:
      text: ${CONVERSATION_NAME}
    timeout: 10000
- tapOn:
    id: "com.infinite.netsfere:id/select_checkBox"
- tapOn:
    id: "android:id/search_src_text"
- inputText: ${TARGET_USER1}
- extendedWaitUntil:
    visible:
      text: ${TARGET_USER1}
    timeout: 10000
- tapOn:
    id: "com.infinite.netsfere:id/select_checkBox"
- runFlow:
    when:
      visible: ${TARGET_USER2}
    commands:
      - tapOn:
          id: "android:id/search_src_text"
      - inputText: ${TARGET_USER2}
      - extendedWaitUntil:
          visible:
            text: ${TARGET_USER2}
          timeout: 10000
      - tapOn:
          id: "com.infinite.netsfere:id/select_checkBox"
- tapOn:
    id: "com.infinite.netsfere:id/action_create"
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/send_message_edittext"
    timeout: 15000