appId: com.infinite.netsfere
tags:
  - android-send-message
---
# =============================================================================
# Android navigates to a conversation and sends a text message
# Requires: CONVERSATION_NAME, MESSAGE_TEXT
# =============================================================================
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "com.infinite.netsfere:id/send_message_edittext"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "com.infinite.netsfere:id/new_conversation_fab"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ${CONVERSATION_NAME}
    direction: DOWN
    timeout: 30000
    speed: 40
- tapOn:
    text: ${CONVERSATION_NAME}
- assertVisible:
    id: "com.infinite.netsfere:id/send_message_edittext"
- tapOn:
    id: "com.infinite.netsfere:id/send_message_edittext"
- inputText: ${MESSAGE_TEXT}
- hideKeyboard
- tapOn:
    id: "com.infinite.netsfere:id/send_button"
- extendedWaitUntil:
    visible:
      text: ".*${MESSAGE_TEXT}.*"
    timeout: 15000
