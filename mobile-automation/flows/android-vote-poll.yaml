appId: com.infinite.netsfere
tags:
  - android-vote-poll
---
- launchApp:
    clearState: false
- assertVisible:
    id: "com.infinite.netsfere:id/send_message_edittext"
# =============================================================================
# Android votes on a visible poll by tapping a specific option text
# Requires: VOTE_OPTION
# Assumes: inside the conversation, poll is visible
# =============================================================================
- extendedWaitUntil:
    visible:
      text: ${VOTE_OPTION}
    timeout: 15000
- tapOn:
    text: ${VOTE_OPTION}
